name: Content guard

on:
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the guard diffs against the PR's base ref

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Run content guard
        run: node scripts/ci-content-guard.mjs "origin/${{ github.event.pull_request.base.ref }}"
