name: Fetch news

on:
  schedule:
    - cron: '30 3 * * *'  # daily 03:30 UTC (~09:00 IST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install fast-xml-parser

      - name: Fetch news and write summaries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-news.mjs

      # Fully automated as of 2026-09 (explicit site-owner instruction) — no
      # PR, no human review gate. Commercial/vendor domains, industry press
      # releases and off-topic items are screened by fetch-news.mjs itself
      # (blocklist.json, press-wire-domains.json + title patterns,
      # keywordFilter); the News index carries a standing disclaimer that
      # these are auto-generated and don't reflect AVI's views. Scoped to
      # `news` only — research and testimonials still go through a PR.
      - name: Commit and push new entries
        run: |
          git config user.name "AVI news bot"
          git config user.email "contact@vapeindia.org"
          git add src/content/news
          if git diff --cached --quiet; then
            echo "No new entries."
          else
            git commit -m "News: add new auto-fetched entries"
            git push
          fi
