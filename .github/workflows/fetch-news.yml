name: Fetch news

on:
  schedule:
    - cron: '30 3 * * *'  # daily 03:30 UTC (~09:00 IST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install fast-xml-parser

      # fetch-news.mjs decides everything itself: an item that clears every
      # filter is written reviewed: true; anything rejected is logged to
      # data/rejected-log.json and never written. No review gate, so
      # whatever lands in src/content/news is ready to publish as-is.
      - name: Fetch news and write summaries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-news.mjs

      - name: Commit and push new entries
        run: |
          git config user.name "AVI news bot"
          git config user.email "contact@vapeindia.org"
          git add src/content/news
          [ -f data/rejected-log.json ] && git add data/rejected-log.json
          if git diff --cached --quiet; then
            echo "No new entries."
          else
            git commit -m "News: auto-fetch"
            git push
          fi
