name: Fetch research

on:
  schedule:
    - cron: '0 5 * * 1'   # every Monday 05:00 UTC (~10:30 IST)
  workflow_dispatch: {}    # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --omit=dev --include=optional --no-audit --no-fund || npm install fast-xml-parser

      - name: Fetch new research and write briefs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-research.mjs

      # Fully automated as of 2026-09 (explicit site-owner instruction,
      # mirroring fetch-news.yml) — no PR, no human review gate. Safe only
      # because fetch-research.mjs validates/clamps every AI-classified
      # field against the content.config.ts schema before writing it (see
      # that script's header comment) — don't remove that guardrail.
      - name: Commit and push new entries
        run: |
          git config user.name "AVI research bot"
          git config user.email "contact@vapeindia.org"
          git add src/content/research
          if git diff --cached --quiet; then
            echo "No new entries."
          else
            git commit -m "Research: add new auto-fetched entries"
            git push
          fi
