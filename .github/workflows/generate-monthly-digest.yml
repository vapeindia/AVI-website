name: Generate monthly news digest

on:
  schedule:
    - cron: '0 5 3 * *'  # 3rd of each month, 05:00 UTC — after the prior month's last weekly digest has run
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Roll up last month's news into a monthly digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-monthly-digest.mjs

      # Fully automated, same as fetch-news.yml and generate-weekly-digest.yml
      # — no PR, no human review gate (site-owner instruction, 2026-09).
      - name: Commit and push new monthly digest(s)
        run: |
          git config user.name "AVI news bot"
          git config user.email "contact@vapeindia.org"
          git add src/content/news-digests
          if git diff --cached --quiet; then
            echo "No new monthly digests."
          else
            git commit -m "News: add monthly digest for elapsed month(s)"
            git push
          fi
