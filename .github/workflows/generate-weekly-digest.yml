name: Generate weekly news digest

on:
  schedule:
    - cron: '0 4 * * 1'  # Monday 04:00 UTC (~09:30 IST) — after the prior week has fully closed
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Roll up last week's news into a weekly digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-weekly-digest.mjs

      # Fully automated as of 2026-09 (explicit site-owner instruction) — no
      # PR, no human review gate. Built only from news items already
      # written by fetch-news.mjs (which screens for commercial/vendor
      # domains and industry press releases before anything lands), so
      # nothing unscreened feeds into a weekly rollup either.
      - name: Commit and push new weekly digest(s)
        run: |
          git config user.name "AVI news bot"
          git config user.email "contact@vapeindia.org"
          git add src/content/news-digests
          if git diff --cached --quiet; then
            echo "No new weekly digests."
          else
            git commit -m "News: add weekly digest for elapsed week(s)"
            git push
          fi
